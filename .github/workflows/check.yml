name: nix flake check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master

  schedule:
    - cron: "0 0 * * MON"

permissions:
  contents: read

# Cancel existing executions when new commits are pushed onto the branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-nix
      - run: nix flake check -L
      # This needs to run outside of nix checks because it downloads new packages (gems)
      - run: nix run '.#lock'
      - run: git diff --exit-code gemset.nix  # Fail if it changed
