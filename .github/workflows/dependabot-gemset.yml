name: Update gemset.nix on Dependabot PRs

# Dependabot only bumps Gemfile.lock. Regenerate gemset.nix from it and push
# the result back onto the PR branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Gemfile
      - Gemfile.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemset:
    name: gemset
    permissions:
      contents: write # Push regenerated gem locks back to the PR branch.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: ./.github/actions/install-nix
      - run: nix run '.#lock'
      - name: Commit and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # Create the commit through the API so that GitHub signs it.
        # Branch protection requires verified signatures.
        run: |
          if git diff --quiet -- Gemfile.lock gemset.nix; then
            echo "gemset.nix already up to date."
            exit 0
          fi
          additions=$(git diff --name-only -- Gemfile.lock gemset.nix |
            while read -r f; do
              jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" \
                '{path: $path, contents: $contents}'
            done | jq -s .)
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg head "$(git rev-parse HEAD)" \
            --argjson additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "Update gemset.nix"},
                fileChanges: {additions: $additions}
              }}
            }' | gh api graphql --input -
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so
      # check.yml won't run on the new commit. Run the checks here instead.
      - if: steps.push.outputs.pushed == 'true'
        run: nix flake check -L
