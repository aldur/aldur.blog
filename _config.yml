title: Universal Bits
short_title: U Bits

about:
  long: >- # ignore line-breaks until next key.
    Sometimes, I'll find knowledge that has stood the test of time and applies
    across disciplines. It helps me connect the dots, make better decisions, or
    simply understand things more deeply. Some call it "mental models"; I like
    to call it "Universal Bits" and I write about it here. You will also find me 
    writing about computer science and any topic that captures my curiosity.
  short: >-
    Hi! 👋 Exploring mental models, connecting the dots, and writing about it.

# --- Required by Jekyll SEO

twitter:
  username: AdrianoDiLuzio
  card: summary_large_image

tagline: aldur's blog

description: >-
  Exploring mental models, connecting the dots, and writing about it.

logo: /assets/images/favicon.svg

social:
  name: aldur
  links:
    - https://x.com/AdrianoDiLuzio
    - https://github.com/aldur

# --- /Required by Jekyll SEO

# Author for both site and posts
author:
  name: aldur
  nick: aldur
  email: hello@aldur.blog
  pgp_pk_url: https://github.com/aldur.gpg
  twitter: AdrianoDiLuzio

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-relative-links
  # This requires `url` being set.
  # Also, its effect depend on _where_ you position in in the plugins list.
  # See: https://github.com/jekyll/jekyll-sitemap
  - jekyll-sitemap

# Theme-specific settings

minima:
  skin: auto

  # Minima date format.
  # Refer to https://shopify.github.io/liquid/filters/date/
  # if you want to customize this.
  #
  # date_format: "%b %-d, %Y"

  # Generate social links in footer.
  social_links:
    - title: aldur on GitHub
      icon: github
      url: "https://github.com/aldur"
    - title: aldur on Bluesky
      icon: bluesky
      url: "https://bsky.app/profile/aldur.blog"
    - title: AdrianoDiLuzio on X (formerly Twitter)
      icon: x-twitter
      url: "https://x.com/AdrianoDiLuzio"

  show_excerpts: true
  show_tags: true

# Add the path to the header pages in the order they should show up.
header_pages:
  - pages/micro.md
  - pages/about.md

strict_front_matter : true

liquid:
  strict_filters    : true

incremental         : false

exclude:
  - LICENSE
  - README.md
  - flake.*
  - flake.nix
  - gemset.nix
  - .direnv/
  - cloudflare_build.sh
  - wrangler.toml
  # OG image rendering toolchain (see _plugins/og_image.rb, bin/og-render.mjs).
  - bin/
  - test/
  - node_modules/
  - package.json
  - pnpm-lock.yaml

defaults:
  # When not specified, posts will have a `post` layout
  # and have `articles` in the categories.
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      categories:
        - "articles"
  # Same for `micros`
  -
    scope:
      path: ""
      type: "micros"
    values:
      layout: "post"
      is_micro: true
      show_excerpt: false  # Ensure no excerpts in tag pages
      categories:
        - "micros"
  # Same for `tag_indexes`
  -
    scope:
      path: ""
      type: "tag_indexes"
    values:
      layout: "tag_index"
      categories:
        - "tag_indexes"

collections:
  micros:
    output: true
    permalink: micros/:year/:month/:day/:title/
    show_excerpts: false
  tag_indexes:
    output: true
    permalink: tags/:name:output_ext

redirect_from:
  json: false

relative_links:
  collections: true
  strict: true

feed:
  collections:
    - micros

# Silence Saas deprecation warnings, to be removed after this is fixed upstream in minima:
# https://github.com/jekyll/minima/issues/815#issuecomment-2440028795
sass:
  quiet_deps: true
  silence_deprecations: ['import']
